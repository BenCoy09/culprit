name: kane-check

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Show Kane version
        run: kane-cli --version

      - name: Log in with basic auth (secrets)
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: Who am I
        run: kane-cli whoami
