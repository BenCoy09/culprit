name: author-frozen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Seed, start app, author with real Kane (spends credits)
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          rm -rf demo/repo
          node demo/seed.mjs demo/repo --clean-revert
          G=$(git -C demo/repo rev-list --max-parents=0 HEAD)
          git -C demo/repo checkout -q "$G"
          cd demo/repo
          PORT=3000 node server.js > /tmp/app.log 2>&1 &
          APP=$!
          for i in $(seq 1 20); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000 | grep -c "Add to cart" || { echo "APP NOT READY"; exit 1; }
          kane-cli testmd run tests/checkout_test.md --url http://localhost:3000 \
            --headless --agent --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          kill $APP || true
          ls -la tests

      - name: Save recordings into frozen/
        run: |
          mkdir -p frozen
          cp -r demo/repo/tests/. frozen/
          ls -laR frozen | head -40

      - name: Commit frozen/ to the repo
        run: |
          git add -f frozen
          git commit -m "Add frozen Kane recordings" || echo "nothing to commit"
          git push
